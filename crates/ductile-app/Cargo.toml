[package]
name = "ductile-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Ductile: a free NURBS solid and surface modeler."

[package.metadata.deb]
name = "ductile"
maintainer = "Ductile contributors"
section = "graphics"
extended-description = "A keyboard-driven NURBS solid and surface modeler with its own B-rep kernel, curvature-continuous fillets and STEP import/export."
assets = [
    ["target/release/ductile", "usr/bin/", "755"],
    ["../../packaging/linux/io.github.fcoltro.Ductile.desktop", "usr/share/applications/", "644"],
    ["../../packaging/linux/io.github.fcoltro.Ductile.metainfo.xml", "usr/share/metainfo/", "644"],
    ["../../packaging/linux/ductile.svg", "usr/share/icons/hicolor/scalable/apps/io.github.fcoltro.Ductile.svg", "644"],
    ["../../packaging/linux/ductile.png", "usr/share/icons/hicolor/256x256/apps/io.github.fcoltro.Ductile.png", "644"],
    ["../../packaging/linux/ductile-mime.xml", "usr/share/mime/packages/io.github.fcoltro.Ductile.xml", "644"],
]

[[bin]]
name = "ductile"
path = "src/main.rs"

[dependencies]
ductile-geom.workspace = true
ductile-brep.workspace = true
ductile-io.workspace = true
glam.workspace = true
bytemuck.workspace = true
serde.workspace = true
serde_json.workspace = true
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "wayland", "x11"] }
egui-wgpu = "0.37"
egui = "0.37"
log = "0.4"
png = "0.18"
jpeg-decoder = { version = "0.3", default-features = false }
env_logger = "0.11"
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
ttf-parser = "0.25"
epaint_default_fonts = "0.37"
