[workspace]
resolver = "2"
members = ["crates/ductile-geom", "crates/ductile-brep", "crates/ductile-io", "crates/ductile-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/fcoltro/ductile"
authors = ["Ductile contributors"]

[workspace.dependencies]
glam = { version = "0.34", features = ["serde", "bytemuck"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
spade = "2.15"
thiserror = "2"
bytemuck = { version = "1", features = ["derive"] }
ductile-geom = { path = "crates/ductile-geom" }
ductile-brep = { path = "crates/ductile-brep" }
ductile-io = { path = "crates/ductile-io" }

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1
